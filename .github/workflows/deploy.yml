name: Deploy to CloudPanel

# מתי לרוץ: בכל push לענף main
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # מוריד את הקוד מהריפו למכונה הזמנית של גיטהאב
      - uses: actions/checkout@v4

      # מכין את מפתח ה-SSH הפרטי (נשמר ב-Secrets, לא בקוד)
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # מעתיק את תיקיית web לשרת. --delete מוחק בשרת קבצים שנמחקו מהריפו
      - name: Upload site
        run: |
          rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times \
            web/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
